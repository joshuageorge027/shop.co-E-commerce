  <body>
    <header id="heading">
      <figure class="logo">

          />

          <figure class="contain-close-btn">
            <img src="/image/icon-close.png" alt="close icon" id="close" />
          </figure>

          <li class="active"><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>

          <li><a href="#">On Sale</a></li>
          <li><a href="new-arrival.html">New Arrivals</a></li>
          <li><a href="#">Brands</a></li>
        </div>
      </ul>

      <div class="search-bar">
        <input
          type="search"
          name=""
          id="search-bar"
          placeholder="search for products..."
        />
        <img
          src="/image/search-2904.png"
          alt="search icon"
          class="search-icon"
          width="20"
        />
      </div>

      <div class="icons">
        <img
          src="/image/search-2904.png"
          alt="search icon"
          id="search"
          width="20"
        />
        <a href="cart.html"
          ><img
            src="/image/shopping-cart-10925.png"
            alt=""
            width="20"
            id="cart"
        /></a>
        <img src="/image/user-4250.png" alt="" width="20" id="user" />
      </div>
      <div id="overlay"></div>
    </header>
    <div id="ssecon-overlay"></div>

          <div class="form-2">

    <script>
      const user = document.getElementById("user");
      const form = document.getElementById("sign-up");
      const cancel = document.getElementById("cancel");
      const close = document.getElementById("close");
      const menu = document.getElementById("menu");
      const list = document.getElementById("list");
      const overlay = document.getElementById("overlay");
      const sseconOverlay = document.getElementById("ssecon-overlay");
      const submenu = document.getElementById("submenu");
      const arrow = document.getElementById("arrow");
      const search = document.getElementById("search");
      const searchMobile = document.getElementById("search-mobile");
      const heading = document.getElementById("heading");

      search.addEventListener("click", () => {
        searchMobile.style.height = "120px";
        overlay.style.display = "block";
      });

      menu.addEventListener("click", () => {
        list.style.width = "90%";
        overlay.style.display = "block";
        form.style.display = "none";
      });

      close.addEventListener("click", () => {
        list.style.width = "0";
        overlay.style.display = "none";
      });

      sseconOverlay.addEventListener("click", () => {
        form.style.display = "none";
        sseconOverlay.style.display = "none";
        overlay.style.display = "none";
      });

      overlay.addEventListener("click", () => {
        overlay.style.display = "none";
        list.style.width = "0";
        form.style.display = "none";
        sseconOverlay.style.display = "none";
        searchMobile.style.height = "0";
      });

      const logIn = document.getElementById("log-in");

      user.addEventListener("click", () => {
        form.style.display = "block";
        overlay.style.display = "block";
        sseconOverlay.style.display = "block";
      });

      cancel.addEventListener("click", () => {
        form.style.display = "none";
        overlay.style.display = "none";
        sseconOverlay.style.display = "none";
      });

      const tabs = document.querySelectorAll(".tab");

      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((btn) => btn.classList.remove("active"));
          tab.classList.add("active");
        });
      });
    </script>
